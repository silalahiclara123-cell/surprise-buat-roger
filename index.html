<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <!-- Bootstrap & Animate.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:italic,wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #121212; /* Hitam pekat agar foto B&W menonjol */
            color: #e0e0e0; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .hero-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 3.5rem; 
            color: #ffffff;
            letter-spacing: -1px;
        }
        .photo-grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            filter: grayscale(100%); /* Memastikan semua tetap B&W */
            border-radius: 4px;
            transition: all 0.5s ease;
            border: 1px solid #333;
        }
        .photo-grid img:hover {
            filter: grayscale(0%); /* Sedikit kejutan: jadi berwarna saat disentuh */
            transform: scale(1.02);
            border-color: #fff;
        }
        .message-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #333;
            margin: 50px 0;
        }
        /* Style untuk Audio Player */
        .audio-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Audio (Ganti link MP3 di bawah dengan lagu favorit kalian) -->
    <div class="audio-player">
        <audio id="myAudio" controls loop>
            <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="container">
        <!-- Section 1: Intro -->
        <section class="hero-section animate__animated animate__fadeIn">
            <h1 class="animate__animated animate__slideInUp">Subject: You.</h1>
            <p class="text-muted mt-3">Scroll down, I have something for you.</p>
        </section>

        <!-- Section 2: Pesan -->
        <div class="message-card animate__animated animate__fadeInUp">
            <p style="font-style: italic; font-size: 1.1rem; line-height: 1.8;">
                "I was looking at your photos today and realized how much I miss having you around. So, I built this tiny space just to keep your best frames in one place. You look great in every single one of them."
            </p>
        </div>

        <!-- Section 3: Gallery 3x3 -->
        <div class="row g-2 photo-grid">
            <div class="col-4"><img src="foto1.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto2.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto3.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto4.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto5.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto6.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto7.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto8.jpg" class="animate__animated animate__fadeIn"></div>
            <div class="col-4"><img src="foto9.jpg" class="animate__animated animate__fadeIn"></div>
        </div>

        <footer class="text-center py-5 mt-5">
            <p class="text-muted" style="font-size: 0.8rem; letter-spacing: 2px;">MADE BY [NAMAMU] • 2026</p>
        </footer>
    </div>

</body>
</html>
